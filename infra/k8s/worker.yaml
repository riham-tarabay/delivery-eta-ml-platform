apiVersion: apps/v1
kind: Deployment
metadata:
  name: eta-worker
  namespace: eta-platform
spec:
  replicas: 1
  selector:
    matchLabels: {app: eta-worker}
  template:
    metadata:
      labels: {app: eta-worker}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: worker
          image: ghcr.io/OWNER/delivery-eta-ml-platform:latest
          command: ["python", "-m", "delivery_eta.worker"]
          env:
            - {name: MODEL_PATH, value: /app/artifacts/eta_model.joblib}
            - {name: REDIS_URL, valueFrom: {secretKeyRef: {name: delivery-eta-secrets, key: REDIS_URL}}}
            - {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: delivery-eta-secrets, key: DATABASE_URL}}}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
